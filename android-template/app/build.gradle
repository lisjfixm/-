plugins {
    id 'com.android.application'
}

android {
    namespace 'com.mrtgd.game'
    compileSdk 30

    defaultConfig {
        applicationId "com.mrtgd.game"
        minSdk 21
        targetSdk 30
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
}
