name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: windows-2022
    timeout-minutes: 90

    env:
      ANDROID_API: "30"
      BUILD_TOOLS: "30.0.3"
      NDK_VER: "23.2.8568313"
      COCOS_VER: "3.6.1"
      PACKAGE_NAME: "com.mrtgd.game"
      PROJECT_ZIP: "末日.zip"
      OUTPUT_NAME: "MoRiTeGongDui"
      ELECTRON_DISABLE_GPU: "1"
      QT_OPENGL: "software"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate project archive
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest

          if (-not (Test-Path $env:PROJECT_ZIP)) {
            throw "Project zip not found: $env:PROJECT_ZIP"
          }

          $zip = [System.IO.Compression.ZipFile]::OpenRead($env:PROJECT_ZIP)
          try {
            $names = $zip.Entries | Select-Object -ExpandProperty FullName
            if ($names -notmatch 'package\.json|project\.json') {
              throw "The zip does not look like a Cocos project. Expected package.json or project.json."
            }
          } finally {
            $zip.Dispose()
          }

      - name: Unzip project
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest

          if (-not (Test-Path $env:PROJECT_ZIP)) {
            throw "Missing zip: $env:PROJECT_ZIP"
          }

          Expand-Archive -Path $env:PROJECT_ZIP -DestinationPath project -Force

          $projRoot = Get-ChildItem -Path project -Recurse -File -Include package.json,project.json |
            Select-Object -First 1 -ExpandProperty DirectoryName

          if (-not $projRoot) {
            throw "Could not find project root that contains package.json or project.json."
          }

          Write-Host "Project root: $projRoot"
          Get-ChildItem $projRoot | Select-Object Name

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android packages
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest

          & "$env:ANDROID_HOME\cmdline-tools\latest\bin\sdkmanager.bat" --licenses
          & "$env:ANDROID_HOME\cmdline-tools\latest\bin\sdkmanager.bat" `
            --install "platforms;android-$env:ANDROID_API" `
                     "build-tools;$env:BUILD_TOOLS" `
                     "ndk;$env:NDK_VER"

          "ANDROID_HOME=$env:ANDROID_HOME" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "ANDROID_NDK_HOME=$env:ANDROID_HOME\ndk\$env:NDK_VER" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
