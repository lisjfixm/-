name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      ANDROID_API: "30"
      BUILD_TOOLS: "30.0.3"
      NDK_VER: "23.2.8568313"
      COCOS_VER: "3.6.1"
      PACKAGE_NAME: "com.mrtgd.game"
      ELECTRON_DISABLE_GPU: "1"
      QT_OPENGL: "software"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip project
        shell: pwsh
        run: |
          Expand-Archive -Path "末日.zip" -DestinationPath project -Force
          Write-Host "--- project root ---"
          Get-ChildItem project | Select-Object Name | Format-Table -AutoSize

      # 把擴展複製到專案，自動注入 Android build 設定
      - name: Install build-fixer extension
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "project\extensions\build-fixer" | Out-Null
          Copy-Item "extensions\build-fixer\*" "project\extensions\build-fixer\" -Recurse -Force
          Write-Host "Extension installed:"
          Get-ChildItem "project\extensions\build-fixer"

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android packages
        run: |
          sdkmanager --install "platforms;android-${env:ANDROID_API}" "build-tools;${env:BUILD_TOOLS}" "ndk;${env:NDK_VER}"
          echo "ANDROID_HOME=$env:ANDROID_HOME" >> $env:GITHUB_ENV
          echo "ANDROID_NDK_HOME=$env:ANDROID_HOME\\ndk\\${env:NDK_VER}" >> $env:GITHUB_ENV

      - name: Download Cocos Creator
        shell: pwsh
        run: |
          $url = "https://download.cocos.com/CocosCreator/v$env:COCOS_VER/CocosCreator-v$env:COCOS_VER-win-091618.zip"
          Write-Host "Downloading $url"
          $ok = $false
          for ($i = 1; $i -le 5; $i++) {
            Write-Host "Attempt $i/5"
            curl.exe -L --fail --retry 3 --retry-delay 5 -C - -o cocos.zip $url
            if ((Test-Path cocos.zip) -and (Get-Item cocos.zip).Length -gt 900000000) {
              Write-Host "Download OK: $((Get-Item cocos.zip).Length) bytes"
              $ok = $true
              break
            }
            Write-Host "Download incomplete, retrying..."
            Start-Sleep -Seconds 10
          }
          if (-not $ok) { Write-Error "Download failed after 5 attempts"; exit 1 }

      - name: Extract Cocos Creator
        run: Expand-Archive -Path cocos.zip -DestinationPath cocos -Force

      # 先跳過 patch，用原始 asar 確認 build 能進入 check 階段
      - name: Skip patch (use original asar)
        shell: pwsh
        run: |
          Write-Host "Using original app.asar without patching"

      - name: Configure Cocos preferences
        shell: pwsh
        run: |
          $prefDir = "$env:APPDATA\\CocosCreator\\3.6.1"
          New-Item -ItemType Directory -Force -Path $prefDir | Out-Null
          $pref = @{
            sdk = @{
              android_sdk_root = "$env:ANDROID_HOME"
              android_ndk_root = "$env:ANDROID_NDK_HOME"
              jdk_home = "$env:JAVA_HOME"
            }
          }
          $json = $pref | ConvertTo-Json -Depth 6
          [System.IO.File]::WriteAllText("$prefDir\\packages.json", $json, [System.Text.UTF8Encoding]::new($false))
          Get-Content "$prefDir\\packages.json"

      # 寫出正確的 build config JSON（無 BOM、欄位名正確）
      - name: Write build config
        shell: pwsh
        run: |
          $cfg = @{
            name = "mrtgd"
            platform = "android"
            buildPath = "project://build"
            debug = $false
            md5Cache = $false
            sourceMaps = $false
            outputName = "MoRiTeGongDui"
            mainBundleCompressionType = "merge_dep"
            useSplashScreen = $true
            packAutoAtlas = $true
            polyfills = @{ asyncFunctions = $false }
            packages = @{
              android = @{
                packageName = "com.mrtgd.game"
                orientation = @{
                  portrait = $true
                  upsideDown = $false
                  landscapeRight = $false
                  landscapeLeft = $false
                }
                apiLevel = "android-30"
                appABIs = @("arm64-v8a")
                useDebugKeystore = $true
                keystorePath = ""
                keystorePassword = ""
                keystoreAlias = ""
                keystoreAliasPassword = ""
                appBundle = $false
                androidInstant = $false
                remoteUrl = ""
                sdkPath = ""
                ndkPath = ""
                renderBackEnd = @{ vulkan = $false; gles3 = $true; gles2 = $false }
              }
              native = @{
                encrypted = $false
                xxteaKey = ""
                compressZip = $false
                JobSystem = "none"
              }
            }
          }
          $json = $cfg | ConvertTo-Json -Depth 10
          [System.IO.File]::WriteAllText("build.json", $json, [System.Text.UTF8Encoding]::new($false))
          Write-Host "--- build.json ---"
          Get-Content build.json

      - name: Build APK
        shell: pwsh
        run: |
          $creator = (Get-ChildItem -Recurse -Filter "CocosCreator.exe" cocos | Select-Object -First 1).FullName
          Write-Host "Editor: $creator"
          $workspace = (Get-Location).Path
          $proj = Join-Path $workspace "project"
          $log  = Join-Path $workspace "build.log"
          $editorDir = Split-Path $creator
          Write-Host "Project: $proj"

          # 啟動 Cocos，然後輪詢 build.log 或 APK
          $buildArgs = "platform=android;debug=false;outputName=MoRiTeGongDui;buildPath=project://build"
          Write-Host "Build args: $buildArgs"
          $p = Start-Process -FilePath $creator -ArgumentList @("--project", $proj, "--build", $buildArgs, "--logDest", $log, "--no-sandbox") -PassThru
          Write-Host "Started PID: $($p.Id)"
          Start-Sleep -Seconds 15
          Write-Host "Running processes:"
          Get-Process | Where-Object { $_.ProcessName -match "Cocos|node|electron" } | Format-Table Id, ProcessName, StartTime -AutoSize

          # 輪詢 build.log 或 APK
          $timeout = 900
          $elapsed = 0
          $found = $false
          while ($elapsed -lt $timeout -and -not $found) {
            Start-Sleep -Seconds 15
            $elapsed += 15
            if (Test-Path $log) {
              $size = (Get-Item $log).Length
              $tail = Get-Content $log -Tail 3
              Write-Host "[$elapsed`s] build.log size: $size, last: $($tail[-1])"
              if ($tail -match "Build finish|Build failed|error|Error|TypeError") {
                $found = $true
                Write-Host "Build appears finished"
              }
            }
            $apk = Get-ChildItem -Recurse -Filter *.apk project -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($apk) {
              Write-Host "APK found: $($apk.FullName)"
              $found = $true
            }
            $procs = Get-Process | Where-Object { $_.ProcessName -match "Cocos" }
            if (-not $procs -and $elapsed -gt 30) {
              Write-Host "No Cocos processes running after $elapsed`s"
              $found = $true
            }
          }

          Write-Host "---- build.log ----"
          if (Test-Path $log) { Get-Content $log -Tail 300 } else { Write-Host "(no build.log)" }
          Write-Host "---- All files in project/build ----"
          if (Test-Path "project\build") { Get-ChildItem -Recurse "project\build" | Select-Object FullName, Length | Format-Table -AutoSize } else { Write-Host "(no build dir)" }

      - name: Locate APK
        id: apk
        shell: pwsh
        run: |
          $apk = Get-ChildItem -Recurse -Filter *.apk project\build 2>$null | Select-Object -First 1
          if (-not $apk) { $apk = Get-ChildItem -Recurse -Filter *.apk . 2>$null | Where-Object { $_.FullName -notlike "*cocos*" } | Select-Object -First 1 }
          if (-not $apk) { Write-Error "APK not found"; exit 1 }
          Write-Host "Found: $($apk.FullName)"
          echo "path=$($apk.FullName)" >> $env:GITHUB_OUTPUT

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MoRiTeGongDui-APK
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
