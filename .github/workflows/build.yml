name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      ANDROID_API: "30"
      BUILD_TOOLS: "30.0.3"
      NDK_VER: "23.2.8568313"
      COCOS_VER: "3.6.1"
      PACKAGE_NAME: "com.mrtgd.game"
      ELECTRON_DISABLE_GPU: "1"
      QT_OPENGL: "software"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip project
        shell: pwsh
        run: |
          Expand-Archive -Path "末日.zip" -DestinationPath project -Force
          Write-Host "--- project root ---"
          Get-ChildItem project | Select-Object Name | Format-Table -AutoSize

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android packages
        run: |
          sdkmanager --install "platforms;android-${env:ANDROID_API}" "build-tools;${env:BUILD_TOOLS}" "ndk;${env:NDK_VER}"
          echo "ANDROID_HOME=$env:ANDROID_HOME" >> $env:GITHUB_ENV
          echo "ANDROID_NDK_HOME=$env:ANDROID_HOME\\ndk\\${env:NDK_VER}" >> $env:GITHUB_ENV

      - name: Download Cocos Creator
        shell: pwsh
        run: |
          $url = "https://download.cocos.com/CocosCreator/v$env:COCOS_VER/CocosCreator-v$env:COCOS_VER-win-091618.zip"
          Write-Host "Downloading $url"
          curl.exe -L --fail -o cocos.zip $url
          if ((Test-Path cocos.zip) -and (Get-Item cocos.zip).Length -gt 100000000) {
            Write-Host "Download OK"
          } else {
            Write-Error "Download failed"; exit 1
          }

      - name: Extract Cocos Creator
        run: Expand-Archive -Path cocos.zip -DestinationPath cocos -Force

      - name: Configure Cocos preferences
        shell: pwsh
        run: |
          $prefDir = "$env:APPDATA\\CocosCreator\\3.6.1"
          New-Item -ItemType Directory -Force -Path $prefDir | Out-Null
          $pref = @{
            sdk = @{
              android_sdk_root = "$env:ANDROID_HOME"
              android_ndk_root = "$env:ANDROID_NDK_HOME"
              jdk_home = "$env:JAVA_HOME"
            }
          }
          $json = $pref | ConvertTo-Json -Depth 6
          [System.IO.File]::WriteAllText("$prefDir\\packages.json", $json, [System.Text.UTF8Encoding]::new($false))
          Get-Content "$prefDir\\packages.json"

      # 寫出正確的 build config JSON（無 BOM、欄位名正確）
      - name: Write build config
        shell: pwsh
        run: |
          $cfg = @{
            name = "mrtgd"
            platform = "android"
            buildPath = "project://build"
            debug = $false
            md5Cache = $false
            sourceMaps = $false
            outputName = "MoRiTeGongDui"
            mainBundleCompressionType = "merge_dep"
            useSplashScreen = $true
            packAutoAtlas = $true
            polyfills = @{ asyncFunctions = $false }
            packages = @{
              android = @{
                packageName = "com.mrtgd.game"
                orientation = @{
                  portrait = $true
                  upsideDown = $false
                  landscapeRight = $false
                  landscapeLeft = $false
                }
                apiLevel = "android-30"
                appABIs = @("arm64-v8a")
                useDebugKeystore = $true
                keystorePath = ""
                keystorePassword = ""
                keystoreAlias = ""
                keystoreAliasPassword = ""
                appBundle = $false
                androidInstant = $false
                remoteUrl = ""
                sdkPath = ""
                ndkPath = ""
                renderBackEnd = @{ vulkan = $false; gles3 = $true; gles2 = $false }
              }
              native = @{
                encrypted = $false
                xxteaKey = ""
                compressZip = $false
                JobSystem = "none"
              }
            }
          }
          $json = $cfg | ConvertTo-Json -Depth 10
          [System.IO.File]::WriteAllText("build.json", $json, [System.Text.UTF8Encoding]::new($false))
          Write-Host "--- build.json ---"
          Get-Content build.json

      - name: Build APK
        shell: pwsh
        run: |
          $creator = (Get-ChildItem -Recurse -Filter "CocosCreator.exe" cocos | Select-Object -First 1).FullName
          Write-Host "Editor: $creator"
          $workspace = (Get-Location).Path
          $proj = Join-Path $workspace "project"
          $cfg  = Join-Path $workspace "build.json"
          $log  = Join-Path $workspace "build.log"
          Write-Host "Project: $proj"
          Write-Host "Config: $cfg"
          Write-Host "Config exists: $(Test-Path $cfg)"

          $editorDir = Split-Path $creator
          Push-Location $editorDir

          # 用 configPath 載入完整 JSON 設定
          $cmd = "`"$creator`" --project `"$proj`" --build `"configPath=$cfg`" --logDest `"$log`" --no-sandbox"
          Write-Host "Running: $cmd"
          & cmd /c $cmd
          Write-Host "Exit code: $LASTEXITCODE"
          Pop-Location

          Write-Host "---- build.log ----"
          if (Test-Path $log) { Get-Content $log -Tail 300 } else { Write-Host "(no build.log)" }

      - name: Locate APK
        id: apk
        shell: pwsh
        run: |
          $apk = Get-ChildItem -Recurse -Filter *.apk project\build 2>$null | Select-Object -First 1
          if (-not $apk) { $apk = Get-ChildItem -Recurse -Filter *.apk . 2>$null | Where-Object { $_.FullName -notlike "*cocos*" } | Select-Object -First 1 }
          if (-not $apk) { Write-Error "APK not found"; exit 1 }
          Write-Host "Found: $($apk.FullName)"
          echo "path=$($apk.FullName)" >> $env:GITHUB_OUTPUT

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MoRiTeGongDui-APK
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
