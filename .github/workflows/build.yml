name: Build Android APK

# 手機上推一下或到 Actions 頁手動執行都會觸發
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      # Cocos Creator 3.6.1 對應的 Android 工具鏈版本
      ANDROID_API: "30"
      BUILD_TOOLS: "30.0.3"
      NDK_VER: "23.2.8568313"
      COCOS_VER: "3.6.1"
      PACKAGE_NAME: "com.mrtgd.game"
      # Electron 在 CI 上禁用 GPU，避免初始化崩潰
      ELECTRON_DISABLE_GPU: "1"
      QT_OPENGL: "software"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 1) 解開專案（你上傳的檔名是 末日.zip）
      - name: Unzip project
        shell: pwsh
        run: |
          Expand-Archive -Path "末日.zip" -DestinationPath project -Force
          Write-Host "--- project/ 第一層 ---"
          Get-ChildItem project | Select-Object Name,Mode | Format-Table -AutoSize
          Write-Host "--- 找專案根目錄（含 package.json 或 project.json） ---"
          Get-ChildItem -Recurse -Filter "package.json" project -Depth 2 | Select-Object FullName
          Get-ChildItem -Recurse -Filter "project.json" project -Depth 2 | Select-Object FullName
          Write-Host "--- 找 assets 資料夾 ---"
          Get-ChildItem -Recurse -Directory -Filter "assets" project -Depth 2 | Select-Object FullName

      # 2) JDK 11（Cocos 3.6 相容）
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      # 3) Android SDK
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android packages
        run: |
          sdkmanager --install "platforms;android-${env:ANDROID_API}" "build-tools;${env:BUILD_TOOLS}" "ndk;${env:NDK_VER}"
          echo "ANDROID_HOME=$env:ANDROID_HOME" >> $env:GITHUB_ENV
          echo "ANDROID_NDK_HOME=$env:ANDROID_HOME\\ndk\\${env:NDK_VER}" >> $env:GITHUB_ENV

      # 4) 下載 Cocos Creator 3.6.1（確切檔名：win-091618）
      - name: Download Cocos Creator
        shell: pwsh
        run: |
          $url = "https://download.cocos.com/CocosCreator/v$env:COCOS_VER/CocosCreator-v$env:COCOS_VER-win-091618.zip"
          Write-Host "Downloading $url"
          curl.exe -L --fail -o cocos.zip $url
          if ((Test-Path cocos.zip) -and (Get-Item cocos.zip).Length -gt 100000000) {
            Write-Host "Download OK"
          } else {
            Write-Error "下載失敗或檔案太小"; exit 1
          }

      - name: Extract Cocos Creator
        run: Expand-Archive -Path cocos.zip -DestinationPath cocos -Force

      # 5) 告訴 Cocos Creator SDK / NDK 在哪
      - name: Configure Cocos preferences
        shell: pwsh
        run: |
          $prefDir = "$env:APPDATA\\CocosCreator\\3.6.1"
          New-Item -ItemType Directory -Force -Path $prefDir | Out-Null
          $pref = @{
            sdk = @{
              android_sdk_root = "$env:ANDROID_HOME"
              android_ndk_root = "$env:ANDROID_NDK_HOME"
              jdk_home = "$env:JAVA_HOME"
            }
          }
          $pref | ConvertTo-Json -Depth 6 | Out-File -Encoding utf8 "$prefDir\\packages.json"
          Get-Content "$prefDir\\packages.json"

      # 6) 建立 build 設定
      - name: Write build config
        shell: pwsh
        run: |
          $cfg = @{
            project = (Resolve-Path project).Path
            platform = "android"
            buildPath = "build/android"
            debug = $false
            outputName = "MoRiTeGongDui"
            packages = @{
              android = @{
                packageName = $env:PACKAGE_NAME
              }
            }
          }
          $cfg | ConvertTo-Json -Depth 6 | Out-File -Encoding utf8 build.json
          Get-Content build.json

      # 7) 執行打包（用 cmd /c 真正等到程式結束）
      - name: Build APK
        shell: pwsh
        run: |
          $creator = (Get-ChildItem -Recurse -Filter "CocosCreator.exe" cocos | Select-Object -First 1).FullName
          Write-Host "Editor: $creator"

          # 自動找專案根目錄：找含 project.json 的資料夾
          $pj = Get-ChildItem -Recurse -Filter "project.json" project -Depth 2 | Select-Object -First 1
          if ($pj) { $proj = Split-Path $pj.FullName; Write-Host "Detected project root: $proj" }
          else { $proj = (Resolve-Path project).Path; Write-Host "Fallback project root: $proj" }

          $cfg  = (Resolve-Path build.json).Path
          $log  = (Join-Path (Get-Location).Path build.log)
          $editorDir = Split-Path $creator
          Push-Location $editorDir

          $cmd = "`"$creator`" --path `"$proj`" --build `"platform=android;debug=false;configPath=$cfg`" --logDest `"$log`" --no-sandbox --disable-gpu 1>stdout.txt 2>stderr.txt"
          Write-Host "Running: $cmd"
          & cmd /c $cmd
          Write-Host "Exit code: $LASTEXITCODE"
          Pop-Location

          Write-Host "---- stdout ----"
          if (Test-Path stdout.txt) { Get-Content stdout.txt -Tail 60 }
          Write-Host "---- stderr ----"
          if (Test-Path stderr.txt) { Get-Content stderr.txt -Tail 60 }
          Write-Host "---- build.log tail ----"
          if (Test-Path $log) { Get-Content $log -Tail 120 } else { Write-Host "(no build.log)" }
          Write-Host "---- Windows 事件日誌（應用程式錯誤） ----"
          Get-WinEvent -FilterHashtable @{LogName='Application'; Level=2; StartTime=(Get-Date).AddMinutes(-15)} -MaxEvents 5 -ErrorAction SilentlyContinue | Select-Object TimeCreated,Message | Format-List

      # 8) 撿出 APK
      - name: Locate APK
        id: apk
        shell: pwsh
        run: |
          $apk = Get-ChildItem -Recurse -Filter *.apk project\build 2>$null | Select-Object -First 1
          if (-not $apk) { $apk = Get-ChildItem -Recurse -Filter *.apk . 2>$null | Where-Object { $_.FullName -notlike "*cocos*" } | Select-Object -First 1 }
          if (-not $apk) { Write-Error "找不到 APK"; exit 1 }
          Write-Host "Found: $($apk.FullName)"
          echo "path=$($apk.FullName)" >> $env:GITHUB_OUTPUT

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MoRiTeGongDui-APK
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
    
