name: Build Android APK

# 手機上推一下或到 Actions 頁手動執行都會觸發
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      # Cocos Creator 3.6.1 對應的 Android 工具鏈版本
      ANDROID_API: "30"
      BUILD_TOOLS: "30.0.3"
      NDK_VER: "23.2.8568313"
      COCOS_VER: "3.6.1"
      PACKAGE_NAME: "com.mrtgd.game"
      # Electron 在 CI 上禁用 GPU，避免初始化崩潰
      ELECTRON_DISABLE_GPU: "1"
      QT_OPENGL: "software"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 1) 解開專案（你上傳的檔名是 末日.zip）
      - name: Unzip project
        run: |
          Expand-Archive -Path "末日.zip" -DestinationPath project -Force
          Get-ChildItem project

      # 2) JDK 11（Cocos 3.6 相容）
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      # 3) Android SDK
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android packages
        run: |
          sdkmanager --install "platforms;android-${env:ANDROID_API}" "build-tools;${env:BUILD_TOOLS}" "ndk;${env:NDK_VER}"
          echo "ANDROID_HOME=$env:ANDROID_HOME" >> $env:GITHUB_ENV
          echo "ANDROID_NDK_HOME=$env:ANDROID_HOME\\ndk\\${env:NDK_VER}" >> $env:GITHUB_ENV

      # 4) 下載 Cocos Creator 3.6.1（確切檔名：win-091618）
      - name: Download Cocos Creator
        shell: pwsh
        run: |
          $url = "https://download.cocos.com/CocosCreator/v$env:COCOS_VER/CocosCreator-v$env:COCOS_VER-win-091618.zip"
          Write-Host "Downloading $url"
          curl.exe -L --fail -o cocos.zip $url
          if ((Test-Path cocos.zip) -and (Get-Item cocos.zip).Length -gt 100000000) {
            Write-Host "Download OK"
          } else {
            Write-Error "下載失敗或檔案太小"; exit 1
          }

      - name: Extract Cocos Creator
        run: Expand-Archive -Path cocos.zip -DestinationPath cocos -Force

      # 5) 告訴 Cocos Creator SDK / NDK 在哪
      - name: Configure Cocos preferences
        shell: pwsh
        run: |
          $prefDir = "$env:APPDATA\\CocosCreator\\3.6.1"
          New-Item -ItemType Directory -Force -Path $prefDir | Out-Null
          $pref = @{
            sdk = @{
              android_sdk_root = "$env:ANDROID_HOME"
              android_ndk_root = "$env:ANDROID_NDK_HOME"
              jdk_home = "$env:JAVA_HOME"
            }
          }
          $pref | ConvertTo-Json -Depth 6 | Out-File -Encoding utf8 "$prefDir\\packages.json"
          Get-Content "$prefDir\\packages.json"

      # 6) 建立 build 設定
      - name: Write build config
        shell: pwsh
        run: |
          $cfg = @{
            project = (Resolve-Path project).Path
            platform = "android"
            buildPath = "build/android"
            debug = $false
            outputName = "MoRiTeGongDui"
            packages = @{
              android = @{
                packageName = $env:PACKAGE_NAME
              }
            }
          }
          $cfg | ConvertTo-Json -Depth 6 | Out-File -Encoding utf8 build.json
          Get-Content build.json

      # 7) 診斷 + 執行打包
      - name: Build APK
        shell: pwsh
        run: |
          $creator = (Get-ChildItem -Recurse -Filter "CocosCreator.exe" cocos | Select-Object -First 1).FullName
          Write-Host "Editor: $creator"
          Write-Host "--- cocos folder top level ---"
          Get-ChildItem (Split-Path $creator) | Select-Object Name,Length | Format-Table -AutoSize

          $proj = (Resolve-Path project).Path
          $cfg  = (Resolve-Path build.json).Path
          $log  = (Join-Path (Get-Location).Path build.log)
          $editorDir = Split-Path $creator
          Push-Location $editorDir

          # 先測試 exe 能不能啟動：--version，輸出導到檔案
          Write-Host "=== diagnostic: --version ==="
          & cmd /c "`"$creator`" --version 1>ver_out.txt 2>ver_err.txt"
          Write-Host "version exit: $LASTEXITCODE"
          Write-Host "--- ver_out.txt ---"; if (Test-Path ver_out.txt) { Get-Content ver_out.txt -Tail 30 }
          Write-Host "--- ver_err.txt ---"; if (Test-Path ver_err.txt) { Get-Content ver_err.txt -Tail 30 }

          # 實際打包（用 --path，build 參數直接寫）
          Write-Host "=== real build ==="
          $args = @(
            "--path", "`"$proj`"",
            "--build", "`"platform=android;debug=false;configPath=$cfg`"",
            "--logDest", "`"$log`"",
            "--no-sandbox"
          )
          Write-Host "Running: $creator $args"
          $p = Start-Process -FilePath $creator -ArgumentList $args -Wait -PassThru -NoNewWindow
          Pop-Location
          Write-Host "Cocos exit code: $($p.ExitCode)"
          Write-Host "---- build.log tail ----"
          if (Test-Path $log) { Get-Content $log -Tail 120 } else { Write-Host "(no build.log)" }

      # 8) 撿出 APK
      - name: Locate APK
        id: apk
        shell: pwsh
        run: |
          $apk = Get-ChildItem -Recurse -Filter *.apk project\build 2>$null | Select-Object -First 1
          if (-not $apk) { $apk = Get-ChildItem -Recurse -Filter *.apk . 2>$null | Where-Object { $_.FullName -notlike "*cocos*" } | Select-Object -First 1 }
          if (-not $apk) { Write-Error "找不到 APK"; exit 1 }
          Write-Host "Found: $($apk.FullName)"
          echo "path=$($apk.FullName)" >> $env:GITHUB_OUTPUT

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MoRiTeGongDui-APK
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
