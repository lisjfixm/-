name: Build Android APK

# 手機上推一下或到 Actions 頁手動執行都會觸發
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      # Cocos Creator 3.6.1 對應的 Android 工具鏈版本
      ANDROID_API: "30"
      BUILD_TOOLS: "30.0.3"
      NDK_VER: "23.2.8568313"
      COCOS_VER: "3.6.1"
      PACKAGE_NAME: "com.mrtgd.game"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 1) 解開專案（你上傳的檔名是 末日.zip）
      - name: Unzip project
        run: |
          Expand-Archive -Path "末日.zip" -DestinationPath project -Force
          Get-ChildItem project

      # 2) JDK 11（Cocos 3.6 相容）
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      # 3) Android SDK
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android packages
        run: |
          sdkmanager --install "platforms;android-${env:ANDROID_API}" "build-tools;${env:BUILD_TOOLS}" "ndk;${env:NDK_VER}"
          echo "ANDROID_HOME=$env:ANDROID_HOME" >> $env:GITHUB_ENV
          echo "ANDROID_NDK_HOME=$env:ANDROID_HOME\\ndk\\${env:NDK_VER}" >> $env:GITHUB_ENV

      # 4) 下載 Cocos Creator 3.6.1（官方檔名帶日期後綴，依發布日 2022-09-22 掃候選）
      - name: Download Cocos Creator
        shell: pwsh
        run: |
          $base = "https://download.cocos.com/CocosCreator/v$env:COCOS_VER/CocosCreator-v$env:COCOS_VER-win32-"
          $days = @("0922","0921","0923","0920","0924")
          $hours = @("08","10","12","14","15","16","17","18","19","20","21","22")
          $ok = $false
          foreach ($d in $days) {
            foreach ($h in $hours) {
              $url = "$base${d}${h}.zip"
              Write-Host "Trying $url"
              try {
                curl.exe -L --fail --max-time 30 -o cocos.zip $url
                if ((Test-Path cocos.zip) -and (Get-Item cocos.zip).Length -gt 100000000) {
                  Write-Host "SUCCESS: $url"
                  $ok = $true
                  break
                }
              } catch {}
            }
            if ($ok) { break }
          }
          if (-not $ok) { Write-Error "找不到 Cocos Creator 3.6.1 下載檔，請把實際網址補進這個步驟"; exit 1 }

      - name: Extract Cocos Creator
        run: Expand-Archive -Path cocos.zip -DestinationPath cocos -Force

      # 5) 告訴 Cocos Creator SDK / NDK 在哪
      - name: Configure Cocos preferences
        shell: pwsh
        run: |
          $prefDir = "$env:APPDATA\\CocosCreator\\3.6.1"
          New-Item -ItemType Directory -Force -Path $prefDir | Out-Null
          $pref = @{
            sdk = @{
              android_sdk_root = "$env:ANDROID_HOME"
              android_ndk_root = "$env:ANDROID_NDK_HOME"
              jdk_home = "$env:JAVA_HOME"
            }
          }
          $pref | ConvertTo-Json -Depth 6 | Out-File -Encoding utf8 "$prefDir\\packages.json"
          Get-Content "$prefDir\\packages.json"

      # 6) 建立 build 設定
      - name: Write build config
        shell: pwsh
        run: |
          $cfg = @{
            project = (Resolve-Path project).Path
            platform = "android"
            buildPath = "build/android"
            debug = $false
            outputName = "MoRiTeGongDui"
            packages = @{
              android = @{
                packageName = $env:PACKAGE_NAME
              }
            }
          }
          $cfg | ConvertTo-Json -Depth 6 | Out-File -Encoding utf8 build.json
          Get-Content build.json

      # 7) 執行無頭打包
      - name: Build APK
        shell: pwsh
        run: |
          $creator = Get-ChildItem -Recurse -Filter "CocosCreator.exe" cocos | Select-Object -First 1
          Write-Host "Editor: $($creator.FullName)"
          & $creator.FullName --project (Resolve-Path project).Path --build "configPath=$(Resolve-Path build.json)" --logDest build.log
          Write-Host "---- build.log tail ----"
          if (Test-Path build.log) { Get-Content build.log -Tail 80 }

      # 8) 撿出 APK
      - name: Locate APK
        id: apk
        shell: pwsh
        run: |
          $apk = Get-ChildItem -Recurse -Filter *.apk project\build 2>$null | Select-Object -First 1
          if (-not $apk) { $apk = Get-ChildItem -Recurse -Filter *.apk . 2>$null | Where-Object { $_.FullName -notlike "*cocos*" } | Select-Object -First 1 }
          if (-not $apk) { Write-Error "找不到 APK"; exit 1 }
          Write-Host "Found: $($apk.FullName)"
          echo "path=$($apk.FullName)" >> $env:GITHUB_OUTPUT

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MoRiTeGongDui-APK
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
