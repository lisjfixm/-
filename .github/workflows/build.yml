name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      ANDROID_API: "30"
      BUILD_TOOLS: "30.0.3"
      NDK_VER: "23.2.8568313"
      COCOS_VER: "3.6.1"
      PACKAGE_NAME: "com.mrtgd.game"
      ELECTRON_DISABLE_GPU: "1"
      QT_OPENGL: "software"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip project
        shell: pwsh
        run: |
          Expand-Archive -Path "末日.zip" -DestinationPath project -Force
          Write-Host "--- project root ---"
          Get-ChildItem project | Select-Object Name | Format-Table -AutoSize

      # 把擴展複製到專案，自動注入 Android build 設定
      - name: Install build-fixer extension
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "project\extensions\build-fixer" | Out-Null
          Copy-Item "extensions\build-fixer\*" "project\extensions\build-fixer\" -Recurse -Force
          Write-Host "Extension installed:"
          Get-ChildItem "project\extensions\build-fixer"

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android packages
        run: |
          sdkmanager --install "platforms;android-${env:ANDROID_API}" "build-tools;${env:BUILD_TOOLS}" "ndk;${env:NDK_VER}"
          echo "ANDROID_HOME=$env:ANDROID_HOME" >> $env:GITHUB_ENV
          echo "ANDROID_NDK_HOME=$env:ANDROID_HOME\\ndk\\${env:NDK_VER}" >> $env:GITHUB_ENV

      - name: Download Cocos Creator
        shell: pwsh
        run: |
          $url = "https://download.cocos.com/CocosCreator/v$env:COCOS_VER/CocosCreator-v$env:COCOS_VER-win-091618.zip"
          Write-Host "Downloading $url"
          curl.exe -L --fail -o cocos.zip $url
          if ((Test-Path cocos.zip) -and (Get-Item cocos.zip).Length -gt 100000000) {
            Write-Host "Download OK"
          } else {
            Write-Error "Download failed"; exit 1
          }

      - name: Extract Cocos Creator
        run: Expand-Archive -Path cocos.zip -DestinationPath cocos -Force

      # 把 app.asar 解壓成 app 目錄，直接修改（不需要 repack）
      - name: Patch Android builder (extract asar to directory)
        shell: pwsh
        run: |
          $asarPath = Get-ChildItem -Recurse -Filter "app.asar" cocos | Select-Object -First 1
          if (-not $asarPath) { Write-Host "No app.asar found, skipping patch"; exit 0 }
          Write-Host "Found app.asar: $($asarPath.FullName)"

          npm install -g @electron/asar 2>&1 | Out-Null
          $resourcesDir = Split-Path $asarPath.FullName
          $appDir = Join-Path $resourcesDir "app"

          if (Test-Path $appDir) { Remove-Item -Recurse -Force $appDir }
          asar extract $asarPath.FullName $appDir
          Write-Host "Extracted to $appDir"

          Remove-Item $asarPath.FullName -Force
          Write-Host "Removed original app.asar, Electron will read from app directory"

          $androidDir = Join-Path $appDir "platforms\extensions\android\dist\builder"
          Write-Host "Android builder dir: $androidDir"

          $optionsJs = Join-Path $androidDir "options.js"
          if (Test-Path $optionsJs) {
            $content = Get-Content $optionsJs -Raw
            $content = $content.Replace('packageName:""', 'packageName:"com.mrtgd.game"')
            $content = $content.Replace('apiLevel:"android-26"', 'apiLevel:"android-30"')
            $content = $content.Replace('portrait:!1,upsideDown:!1,landscapeRight:!0,landscapeLeft:!0', 'portrait:!0,upsideDown:!1,landscapeRight:!1,landscapeLeft:!1')
            $content = $content.Replace('["packageName","apiLevel","keystorePath","keystorePassword","keystoreAlias","keystoreAliasPassword"]', '[]')
            [System.IO.File]::WriteAllText($optionsJs, $content, [System.Text.UTF8Encoding]::new($false))
            Write-Host "options.js patched"
          }

          $indexJs = Join-Path $androidDir "index.js"
          if (Test-Path $indexJs) {
            $content = Get-Content $indexJs -Raw
            $content = $content.Replace('verifyRules:["required"]', 'verifyRules:[]')
            [System.IO.File]::WriteAllText($indexJs, $content, [System.Text.UTF8Encoding]::new($false))
            Write-Host "index.js patched"
          }

          $optContent = Get-Content $optionsJs -Raw
          $hasPkg = $optContent.Contains('packageName:"com.mrtgd.game"')
          $hasApi = $optContent.Contains('apiLevel:"android-30"')
          Write-Host "Verification: packageName=$hasPkg, apiLevel=$hasApi"

      - name: Configure Cocos preferences
        shell: pwsh
        run: |
          $prefDir = "$env:APPDATA\\CocosCreator\\3.6.1"
          New-Item -ItemType Directory -Force -Path $prefDir | Out-Null
          $pref = @{
            sdk = @{
              android_sdk_root = "$env:ANDROID_HOME"
              android_ndk_root = "$env:ANDROID_NDK_HOME"
              jdk_home = "$env:JAVA_HOME"
            }
          }
          $json = $pref | ConvertTo-Json -Depth 6
          [System.IO.File]::WriteAllText("$prefDir\\packages.json", $json, [System.Text.UTF8Encoding]::new($false))
          Get-Content "$prefDir\\packages.json"

      # 寫出正確的 build config JSON（無 BOM、欄位名正確）
      - name: Write build config
        shell: pwsh
        run: |
          $cfg = @{
            name = "mrtgd"
            platform = "android"
            buildPath = "project://build"
            debug = $false
            md5Cache = $false
            sourceMaps = $false
            outputName = "MoRiTeGongDui"
            mainBundleCompressionType = "merge_dep"
            useSplashScreen = $true
            packAutoAtlas = $true
            polyfills = @{ asyncFunctions = $false }
            packages = @{
              android = @{
                packageName = "com.mrtgd.game"
                orientation = @{
                  portrait = $true
                  upsideDown = $false
                  landscapeRight = $false
                  landscapeLeft = $false
                }
                apiLevel = "android-30"
                appABIs = @("arm64-v8a")
                useDebugKeystore = $true
                keystorePath = ""
                keystorePassword = ""
                keystoreAlias = ""
                keystoreAliasPassword = ""
                appBundle = $false
                androidInstant = $false
                remoteUrl = ""
                sdkPath = ""
                ndkPath = ""
                renderBackEnd = @{ vulkan = $false; gles3 = $true; gles2 = $false }
              }
              native = @{
                encrypted = $false
                xxteaKey = ""
                compressZip = $false
                JobSystem = "none"
              }
            }
          }
          $json = $cfg | ConvertTo-Json -Depth 10
          [System.IO.File]::WriteAllText("build.json", $json, [System.Text.UTF8Encoding]::new($false))
          Write-Host "--- build.json ---"
          Get-Content build.json

      - name: Build APK
        shell: pwsh
        run: |
          $creator = (Get-ChildItem -Recurse -Filter "CocosCreator.exe" cocos | Select-Object -First 1).FullName
          Write-Host "Editor: $creator"
          $workspace = (Get-Location).Path
          $proj = Join-Path $workspace "project"
          $log  = Join-Path $workspace "build.log"
          $editorDir = Split-Path $creator
          Write-Host "Project: $proj"

          # 用 System.Diagnostics.Process，內部引號用 \" 跳脫
          $packagesJson = '{\"android\":{\"packageName\":\"com.mrtgd.game\",\"apiLevel\":\"android-30\",\"appABIs\":[\"arm64-v8a\"],\"useDebugKeystore\":true}}'
          $buildArgs = "platform=android;debug=false;outputName=MoRiTeGongDui;buildPath=project://build;packages=$packagesJson"
          Write-Host "Build args: $buildArgs"
          $psi = New-Object System.Diagnostics.ProcessStartInfo
          $psi.FileName = $creator
          $psi.Arguments = "--project `"$proj`" --build `"$buildArgs`" --logDest `"$log`" --no-sandbox"
          $psi.UseShellExecute = $false
          Write-Host "Arguments: $($psi.Arguments)"
          $p = [System.Diagnostics.Process]::Start($psi)
          $p.WaitForExit()
          Write-Host "Exit code: $($p.ExitCode)"

          Write-Host "---- build.log ----"
          if (Test-Path $log) { Get-Content $log -Tail 300 } else { Write-Host "(no build.log)" }

      - name: Locate APK
        id: apk
        shell: pwsh
        run: |
          $apk = Get-ChildItem -Recurse -Filter *.apk project\build 2>$null | Select-Object -First 1
          if (-not $apk) { $apk = Get-ChildItem -Recurse -Filter *.apk . 2>$null | Where-Object { $_.FullName -notlike "*cocos*" } | Select-Object -First 1 }
          if (-not $apk) { Write-Error "APK not found"; exit 1 }
          Write-Host "Found: $($apk.FullName)"
          echo "path=$($apk.FullName)" >> $env:GITHUB_OUTPUT

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MoRiTeGongDui-APK
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
