name: Build Android APK (WebView)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: windows-2022
    timeout-minutes: 120
    env:
      ANDROID_API: "30"
      BUILD_TOOLS: "30.0.3"
      COCOS_VER: "3.6.1"
      PACKAGE_NAME: "com.mrtgd.game"
      ELECTRON_DISABLE_GPU: "1"
      QT_OPENGL: "software"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip project
        shell: pwsh
        run: |
          Expand-Archive -Path "末日.zip" -DestinationPath project -Force
          Write-Host "Project unzipped"

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android packages
        shell: pwsh
        run: |
          sdkmanager "platforms;android-30" "build-tools;30.0.3" "platform-tools"
          Write-Host "Android SDK ready"

      - name: Download Cocos Creator
        shell: pwsh
        run: |
          $url = "https://download.cocos.com/CocosCreator/v3.6.1/CocosCreator-v3.6.1-win-091618.zip"
          $output = "cocos.zip"
          $ok = $false
          for ($i = 1; $i -le 5; $i++) {
            Write-Host "Download attempt $i..."
            try {
              Invoke-WebRequest -Uri $url -OutFile $output -UseBasicParsing -TimeoutSec 600
              $ok = $true
              break
            } catch {
              Write-Host "Attempt $i failed: $($_.Exception.Message)"
              Start-Sleep -Seconds 10
            }
          }
          if (-not $ok) { Write-Error "Download failed after 5 attempts"; exit 1 }
          Write-Host "Downloaded: $((Get-Item $output).Length) bytes"

      - name: Extract Cocos Creator
        shell: pwsh
        run: |
          Expand-Archive -Path "cocos.zip" -DestinationPath cocos -Force
          Write-Host "Extracted"

      - name: Configure Cocos preferences
        shell: pwsh
        run: |
          $prefDir = "$env:APPDATA\CocosCreator\3.6.1"
          New-Item -ItemType Directory -Force -Path $prefDir | Out-Null
          $pref = @{
            sdk = @{
              android_sdk_root = "$env:ANDROID_HOME"
              jdk_home = "$env:JAVA_HOME"
            }
          }
          $json = $pref | ConvertTo-Json -Depth 6
          [System.IO.File]::WriteAllText("$prefDir\packages.json", $json, [System.Text.UTF8Encoding]::new($false))
          Write-Host "Preferences set"

      - name: Build web-mobile with Cocos Creator
        shell: pwsh
        run: |
          $creator = (Get-ChildItem -Recurse -Filter "CocosCreator.exe" cocos | Select-Object -First 1).FullName
          Write-Host "Editor: $creator"
          $workspace = (Get-Location).Path
          $simpleProj = "D:\cocos_project"
          if (Test-Path $simpleProj) { Remove-Item -Recurse -Force $simpleProj }
          Copy-Item -Recurse "project" $simpleProj

          $buildConfig = @{
            platform = "web-mobile"
            buildPath = "build"
            debug = $false
            outputName = "web-mobile"
            sourceMaps = $false
            md5Cache = $false
          }
          $json = $buildConfig | ConvertTo-Json -Depth 10 -Compress
          $configPath = Join-Path $workspace "web_build.json"
          [System.IO.File]::WriteAllText($configPath, $json, [System.Text.UTF8Encoding]::new($false))
          Write-Host "Config: $json"

          $editorDir = Split-Path $creator
          $batchContent = "echo off`r`ncd /d `"$editorDir`"`r`n`"CocosCreator.exe`" --project `"$simpleProj`" --build `"configPath=$configPath`"`r`necho Cocos exited with code %ERRORLEVEL%`r`n"
          [System.IO.File]::WriteAllText("run_web_build.bat", $batchContent, [System.Text.ASCIIEncoding]::new())
          & cmd /c "run_web_build.bat"
          Write-Host "Build finished, exit: $LASTEXITCODE"

          $webBuild = Join-Path $simpleProj "build\web-mobile"
          if (Test-Path $webBuild) {
            Write-Host "Web build output exists, copying to workspace..."
            if (Test-Path "web-output") { Remove-Item -Recurse -Force "web-output" }
            Copy-Item -Recurse $webBuild "web-output" -Force
            Write-Host "Copied. web-output contents:"
            Get-ChildItem "web-output" | Select-Object Name, Length | Format-Table -AutoSize
          } else {
            Write-Host "WARNING: web-mobile build dir not found at $webBuild"
            Write-Host "Listing D:\cocos_project\build :"
            Get-ChildItem "D:\cocos_project\build" -ErrorAction SilentlyContinue | Select-Object Name | Format-Table -AutoSize
          }

      - name: Assemble Android project
        shell: pwsh
        run: |
          # 複製 Android 模板
          if (Test-Path "android-app") { Remove-Item -Recurse -Force "android-app" }
          Copy-Item -Recurse "android-template" "android-app" -Force

          # 把 web build 放到 assets/public
          $assetsDir = "android-app\app\src\main\assets\public"
          New-Item -ItemType Directory -Force -Path $assetsDir | Out-Null

          # 優先用 web-output，否則直接從 D:\cocos_project 複製
          $webSource = $null
          if (Test-Path "web-output") {
            $webSource = "web-output"
          } elseif (Test-Path "D:\cocos_project\build\web-mobile") {
            $webSource = "D:\cocos_project\build\web-mobile"
          }

          if ($webSource) {
            Write-Host "Copying web files from $webSource"
            Copy-Item -Recurse "$webSource\*" $assetsDir -Force
            Write-Host "Assets contents:"
            Get-ChildItem $assetsDir | Select-Object Name | Format-Table -AutoSize
          } else {
            Write-Host "ERROR: No web build source found!"
            Write-Host "web-output exists: $(Test-Path 'web-output')"
            Write-Host "D:\cocos_project\build\web-mobile exists: $(Test-Path 'D:\cocos_project\build\web-mobile')"
            exit 1
          }

          # 下載 gradle wrapper jar
          $wrapperJar = "android-app\gradle\wrapper\gradle-wrapper.jar"
          if (-not (Test-Path $wrapperJar)) {
            $wrapperUrl = "https://raw.githubusercontent.com/gradle/gradle/v7.3.3/gradle/wrapper/gradle-wrapper.jar"
            try {
              Invoke-WebRequest -Uri $wrapperUrl -OutFile $wrapperJar -UseBasicParsing -TimeoutSec 60
              Write-Host "Gradle wrapper jar downloaded"
            } catch {
              Write-Host "Failed to download wrapper jar: $($_.Exception.Message)"
            }
          }

          Write-Host "Android project assembled"

      - name: Build APK with Gradle
        shell: pwsh
        run: |
          Push-Location "android-app"
          $env:ANDROID_HOME = $env:ANDROID_HOME
          $env:GRADLE_OPTS = "-Xmx2048m"
          & .\gradlew.bat assembleDebug --no-daemon 2>&1 | Select-Object -Last 60
          Write-Host "Gradle exit: $LASTEXITCODE"
          Pop-Location

      - name: Locate APK
        id: apk
        shell: pwsh
        run: |
          $apk = Get-ChildItem -Recurse -Filter *.apk "android-app\app\build\outputs" 2>$null | Select-Object -First 1
          if (-not $apk) { $apk = Get-ChildItem -Recurse -Filter *.apk . 2>$null | Where-Object { $_.FullName -notlike "*cocos*" } | Select-Object -First 1 }
          if (-not $apk) { Write-Error "APK not found"; exit 1 }
          Write-Host "Found: $($apk.FullName) ($($apk.Length) bytes)"
          echo "path=$($apk.FullName)" >> $env:GITHUB_OUTPUT

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MoRiTeGongDui.apk
          path: ${{ steps.apk.outputs.path }}
