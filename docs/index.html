<body>
  <!-- Persistent Status Panel -->
  <style>
    #gm-status {
      position: fixed; top: 0; left: 0; right: 0; z-index: 99998;
      background: rgba(0,0,0,0.55);
      color: #0f0; font-family: monospace; font-size: 11px;
      text-align: center; pointer-events: none;
      padding: 4px 8px; min-height: 18px;
      text-shadow: 0 0 3px #000;
      line-height: 1.4;
    }
  </style>
  <div id="gm-status">啟動中...</div>
  <script>
  (function(){
    var el = document.getElementById('gm-status');
    var lastMsg = '';
    function setStatus(msg) {
      if (msg === lastMsg) return;
      lastMsg = msg;
      el.textContent = msg;
    }
    // Hook console
    var origLog = console.log, origWarn = console.warn, origErr = console.error;
    function fmt(args) {
      try { return Array.from(args).map(function(a){
        if (typeof a === 'string') return a;
        try { return JSON.stringify(a).substring(0,80); } catch(e) { return String(a); }
      }).join(' ').substring(0, 150); } catch(e) { return ''; }
    }
    console.log = function() {
      var m = fmt(arguments);
      if (m && m.length > 3) setStatus('📋 ' + m);
      origLog.apply(console, arguments);
    };
    console.warn = function() { setStatus('⚠ ' + fmt(arguments)); origWarn.apply(console, arguments); };
    console.error = function() { setStatus('✖ ' + fmt(arguments)); origErr.apply(console, arguments); };

    // Once Cocos is ready, hook scene/bundle events
    var tryHook = setInterval(function(){
      try {
        if (!window.cc || !cc.director) return;
        clearInterval(tryHook);

        // Scene change tracking
        cc.director.on(cc.Director.EVENT_AFTER_SCENE_LAUNCH, function(scene){
          var name = scene.name || '未知場景';
          var desc = describeScene(name);
          setStatus('🎬 進入場景: ' + desc);
        });

        // Hook preloadScene for progress %
        if (cc.director.preloadScene) {
          var oldPreload = cc.director.preloadScene;
          cc.director.preloadScene = function(sceneName, onProgress, onComplete) {
            var taskName = '加載場景 ' + describeScene(sceneName);
            setStatus('⏳ ' + taskName + ' 0%');
            var wrappedProgress = function(completed, total, item){
              var pct = total > 0 ? Math.floor(completed/total*100) : 0;
              setStatus('⏳ ' + taskName + ' ' + pct + '%');
              if (onProgress) onProgress(completed, total, item);
            };
            return oldPreload.call(this, sceneName, wrappedProgress, function(err, scene){
              if (err) setStatus('✖ 場景加載失敗: ' + sceneName);
              else setStatus('✅ ' + taskName + ' 完成');
              if (onComplete) onComplete(err, scene);
            });
          };
        }

        // Bundle loading
        if (cc.assetManager) {
          var oldLoadBundle = cc.assetManager.loadBundle;
          cc.assetManager.loadBundle = function(name, options, onComplete) {
            // Handle both (name, onComplete) and (name, options, onComplete)
            if (typeof options === 'function') { onComplete = options; options = null; }
            var taskName = '加載資源包: ' + name;
            setStatus('⏳ ' + taskName + '...');
            return oldLoadBundle.call(this, name, options, function(err, bundle){
              if (err) setStatus('✖ ' + taskName + ' 失敗');
              else setStatus('✅ ' + taskName + ' 完成');
              if (onComplete) onComplete(err, bundle);
            });
          };
        }

        // Game start
        setStatus('🎮 遊戲啟動完成，進入主場景');
      } catch(e){}
    }, 200);

    function describeScene(name) {
      var map = {
        'Main': '主場景 / 戰鬥開始',
        'Loading': '加載畫面',
        'Login': '登錄畫面',
        'Hall': '大廳',
        'UILayer': 'UI層',
      };
      for (var key in map) {
        if (name.indexOf(key) >= 0) return map[key];
      }
      return name;
    }
  })();
  </script>
  <div id="GameDiv" cc_exact_fit_screen="true">
      <div id="Cocos3dGameContainer">
        <canvas id="GameCanvas" oncontextmenu="event.preventDefault()" tabindex="99"></canvas>
      </div>
    </div>
  
<!-- Polyfills bundle. -->
<script src="src/polyfills.bundle.js" charset="utf-8"> </script>

<script src="src/system.bundle.js" charset="utf-8"> </script>

    System.import('./index.js').catch(function(err) { console.error(err); })
</script>

<!-- GM Menu -->
<style>
  #gm-fab {
    position: fixed; left: 10px; top: 40%; z-index: 99999;
    width: 44px; height: 44px; border-radius: 50%;
    background: rgba(255,60,60,0.85); color: #fff;
    font-size: 13px; font-weight: bold; line-height: 44px;
    text-align: center; cursor: pointer; user-select: none;
    box-shadow: 0 2px 8px rgba(0,0,0,0.4);
    font-family: sans-serif;
  }
  #gm-panel {
    position: fixed; left: 60px; top: 30%; z-index: 99999;
    width: 200px; background: rgba(20,20,30,0.95);
    border-radius: 10px; padding: 12px; display: none;
    font-family: sans-serif; color: #fff;
    box-shadow: 0 4px 20px rgba(0,0,0,0.5);
  }
  #gm-panel h3 { margin: 0 0 8px; font-size: 14px; color: #ffcc00; }
  #gm-panel button {
    display: block; width: 100%; margin: 4px 0; padding: 8px;
    background: #3a3a5c; color: #fff; border: none; border-radius: 6px;
    font-size: 12px; cursor: pointer;
  }
  #gm-panel button:active { background: #5a5a8c; }
  #gm-panel .gm-close { background: #666; }
</style>
<div id="gm-fab">GM</div>
<div id="gm-panel">
  <h3>GM Menu</h3>
  <button onclick="gmAddCoin()">+100000 金幣</button>
  <button onclick="gmAddGem()">+100000 寶石</button>
  <button onclick="gmMaxLevel()">滿級 & 解鎖關卡</button>
  <button onclick="gmFullPower()">補滿體力</button>
  <button onclick="gmAddExp()">+100000 經驗</button>
  <button onclick="gmReset()">重置存檔</button>
  <button class="gm-close" onclick="gmToggle()">關閉</button>
</div>
<script>
function gmToggle() {
  var p = document.getElementById('gm-panel');
  p.style.display = p.style.display === 'block' ? 'none' : 'block';
}
document.getElementById('gm-fab').addEventListener('click', gmToggle);

function gmRead() {
  try { return JSON.parse(localStorage.getItem('UserData') || '{}'); }
  catch(e) { return {}; }
}
function gmWrite(d) {
  localStorage.setItem('UserData', JSON.stringify(d));
}
function gmReload() { setTimeout(function(){ location.reload(); }, 300); }

function gmAddCoin() {
  var d = gmRead();
  d.$coin = (d.$coin || 0) + 100000;
  gmWrite(d); gmReload();
}
function gmAddGem() {
  var d = gmRead();
  d.$baoShi = (d.$baoShi || 0) + 100000;
  gmWrite(d); gmReload();
}
function gmMaxLevel() {
  var d = gmRead();
  d.$roleLv = 999;
  d.$openLevel = 999;
  d.$curMap = 999;
  d.$levelData = d.$levelData || {};
  gmWrite(d); gmReload();
}
function gmFullPower() {
  var d = gmRead();
  d.$power = 999;
  d.$powerTime = 0;
  gmWrite(d); gmReload();
}
function gmAddExp() {
  var d = gmRead();
  d.$roleExp = (d.$roleExp || 0) + 100000;
  gmWrite(d); gmReload();
}
function gmReset() {
  if (confirm('確定要重置存檔嗎？')) {
    localStorage.removeItem('UserData');
    location.reload();
  }
}
</script>

</body>
